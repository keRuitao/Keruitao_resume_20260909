<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柯锐韬 · 个人简历</title>
<style>
  :root {
    --neon-blue: #00d4ff;
    --neon-purple: #a855f7;
    --neon-pink: #ff2d95;
    --bg-dark: #0a0e1a;
    --card-bg: rgba(255, 255, 255, 0.05);
    --grid-color: rgba(0, 212, 255, 0.04);
    --border-color: rgba(255, 255, 255, 0.08);
    --inner-bg: rgba(255, 255, 255, 0.03);
    --inner-border: rgba(255, 255, 255, 0.06);
    --text-main: #e8ecf5;
    --text-dim: #9aa5c0;
  }

  /* ===== 昼夜主题 ===== */
  body.light {
    --bg-dark: #eef3ff;
    --card-bg: rgba(255, 255, 255, 0.75);
    --grid-color: rgba(80, 100, 255, 0.08);
    --border-color: rgba(80, 100, 255, 0.15);
    --inner-bg: rgba(255, 255, 255, 0.6);
    --inner-border: rgba(80, 100, 255, 0.12);
    --text-main: #1a2238;
    --text-dim: #5a6785;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
    line-height: 1.6;
    transition: background 0.6s ease, color 0.6s ease;
  }

  /* 彩蛋：彩虹模式 */
  body.rainbow { animation: rainbow-hue 4s linear infinite; }
  @keyframes rainbow-hue { to { filter: hue-rotate(360deg); } }

  /* ===== 动态渐变背景 ===== */
  .bg-aurora {
    position: fixed;
    inset: 0;
    z-index: -3;
    background:
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(0, 212, 255, 0.15), transparent),
      radial-gradient(ellipse 60% 60% at 80% 30%, rgba(168, 85, 247, 0.15), transparent),
      radial-gradient(ellipse 70% 50% at 50% 90%, rgba(255, 45, 149, 0.10), transparent);
    animation: aurora-shift 12s ease-in-out infinite alternate;
  }
  @keyframes aurora-shift {
    0%   { filter: hue-rotate(0deg); transform: scale(1); }
    100% { filter: hue-rotate(40deg); transform: scale(1.1); }
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }

  #particles { position: fixed; inset: 0; z-index: -1; }

  /* 特效层：烟花 / 拖尾 / 彩带 */
  #fx-canvas {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  /* ===== 顶部工具栏 ===== */
  .toolbar {
    position: fixed;
    top: 18px; right: 18px;
    z-index: 1000;
    display: flex;
    gap: 10px;
  }
  .tool-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    font-size: 1.25rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .tool-btn:hover {
    transform: scale(1.15) rotate(10deg);
    box-shadow: 0 0 18px rgba(0, 212, 255, 0.4);
  }

  /* ===== 头部 ===== */
  .hero {
    text-align: center;
    margin-bottom: 60px;
    opacity: 0;
    animation: fade-up 0.9s ease forwards;
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar-wrap {
    width: 130px;
    height: 130px;
    margin: 0 auto 24px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-blue));
    animation: spin-glow 6s linear infinite;
    box-shadow: 0 0 40px rgba(0, 212, 255, 0.35);
    cursor: pointer;
    user-select: none;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .avatar-wrap:active { transform: scale(0.9); }
  @keyframes spin-glow { to { transform: rotate(360deg); } }
  .avatar-wrap-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: bold;
    background: linear-gradient(135deg, #1a2238, #0a0e1a);
    color: var(--neon-blue);
    animation: spin-glow 6s linear infinite reverse;
  }

  .hero h1 {
    font-size: 2.6rem;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-blue));
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradient-flow 4s linear infinite;
  }
  @keyframes gradient-flow { to { background-position: 300% center; } }

  .hero .subtitle {
    color: var(--text-dim);
    font-size: 1.05rem;
    margin-top: 8px;
    min-height: 1.6em;
  }
  .cursor {
    display: inline-block;
    width: 3px;
    background: var(--neon-blue);
    animation: blink 0.8s step-end infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .clock {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 8px 20px;
    border-radius: 999px;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    backdrop-filter: blur(10px);
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    font-size: 0.92rem;
  }
  .clock .time { color: var(--neon-blue); font-weight: bold; }

  /* ===== 区块卡片 ===== */
  .section {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 32px 36px;
    margin-bottom: 32px;
    backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
    transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    opacity: 0;
    transform: translateY(40px);
  }
  .section.visible {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.7s ease, transform 0.7s ease, box-shadow 0.35s ease, border-color 0.35s ease;
  }
  .section:hover {
    transform: translateY(-6px) !important;
    border-color: rgba(0, 212, 255, 0.5);
    box-shadow: 0 12px 40px rgba(0, 212, 255, 0.18);
  }
  .section::before {
    content: "";
    position: absolute;
    top: 0; left: -60%;
    width: 60%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
    animation: sweep 3.5s ease-in-out infinite;
  }
  @keyframes sweep { to { left: 110%; } }

  .section-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.35rem;
    margin-bottom: 24px;
  }
  .section-title .icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(168,85,247,0.2));
    border: 1px solid rgba(0,212,255,0.3);
  }

  /* ===== 信息网格 ===== */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .info-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--inner-bg);
    border: 1px solid var(--inner-border);
    transition: all 0.3s ease;
  }
  .info-item:hover {
    background: rgba(0, 212, 255, 0.08);
    border-color: rgba(0, 212, 255, 0.4);
    transform: translateX(6px);
  }
  .info-item .label-icon { font-size: 1.15rem; flex-shrink: 0; }
  .info-item .label { color: var(--text-dim); font-size: 0.85rem; margin-right: 4px; }
  .info-item .value { font-weight: 500; }
  .info-item .value.highlight {
    background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
  }

  /* ===== 时间轴 ===== */
  .timeline { position: relative; padding-left: 30px; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 8px; top: 6px; bottom: 6px;
    width: 2px;
    background: linear-gradient(to bottom, var(--neon-blue), var(--neon-purple), var(--neon-pink));
  }
  .timeline-item {
    position: relative;
    padding: 14px 20px;
    background: var(--inner-bg);
    border: 1px solid var(--inner-border);
    border-radius: 14px;
    margin-bottom: 18px;
    transition: all 0.3s ease;
  }
  .timeline-item:hover {
    background: rgba(168, 85, 247, 0.08);
    border-color: rgba(168, 85, 247, 0.4);
    transform: translateX(8px);
  }
  .timeline-item::before {
    content: "";
    position: absolute;
    left: -28px; top: 22px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--neon-blue);
    box-shadow: 0 0 12px var(--neon-blue);
    animation: pulse-dot 2s ease infinite;
  }
  @keyframes pulse-dot { 50% { box-shadow: 0 0 0 6px rgba(0, 212, 255, 0.15); } }
  .timeline-item .period {
    display: inline-block;
    font-size: 0.8rem;
    padding: 3px 12px;
    border-radius: 999px;
    margin-bottom: 6px;
    color: var(--neon-blue);
    background: rgba(0, 212, 255, 0.1);
    border: 1px solid rgba(0, 212, 255, 0.3);
  }
  .timeline-item .title { font-weight: bold; font-size: 1.05rem; }
  .timeline-item .desc { color: var(--text-dim); font-size: 0.92rem; margin-top: 4px; }

  /* ===== 兴趣标签 ===== */
  .tags { display: flex; flex-wrap: wrap; gap: 12px; }
  .tag {
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 0.95rem;
    background: var(--inner-bg);
    border: 1px solid var(--inner-border);
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .tag:hover {
    background: linear-gradient(90deg, rgba(0,212,255,0.2), rgba(255,45,149,0.2));
    border-color: var(--neon-pink);
    transform: translateY(-4px) rotate(-2deg) scale(1.05);
    box-shadow: 0 6px 20px rgba(255, 45, 149, 0.25);
  }

  /* ===== 点赞按钮 ===== */
  .like-btn {
    position: fixed;
    bottom: 26px; right: 26px;
    z-index: 1000;
    padding: 14px 24px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-size: 1.05rem;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    box-shadow: 0 6px 24px rgba(255, 45, 149, 0.4);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .like-btn:hover { transform: scale(1.08); }
  .like-btn.bumped { animation: bump 0.4s ease; }
  @keyframes bump {
    30% { transform: scale(1.35) rotate(-8deg); }
    60% { transform: scale(0.92) rotate(4deg); }
  }

  /* ===== 提示气泡 ===== */
  .toast {
    position: fixed;
    left: 50%; bottom: 100px;
    transform: translateX(-50%) translateY(20px);
    z-index: 10000;
    padding: 12px 26px;
    border-radius: 999px;
    background: var(--card-bg);
    border: 1px solid rgba(0, 212, 255, 0.5);
    backdrop-filter: blur(10px);
    color: var(--text-main);
    font-size: 0.95rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.35s ease;
    box-shadow: 0 8px 30px rgba(0, 212, 255, 0.2);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 30px 0 10px;
    letter-spacing: 2px;
  }

  @media (max-width: 640px) {
    .section { padding: 24px 20px; }
    .hero h1 { font-size: 2rem; }
  }
</style>
</head>
<body>

<div class="bg-aurora"></div>
<div class="bg-grid"></div>
<canvas id="particles"></canvas>
<canvas id="fx-canvas"></canvas>

<!-- 工具栏 -->
<div class="toolbar">
  <button class="tool-btn" id="theme-btn" title="昼夜切换">🌙</button>
  <button class="tool-btn" id="music-btn" title="8-bit 小音乐">🎵</button>
</div>

<div class="container">

  <header class="hero">
    <div class="avatar-wrap" id="avatar" title="点我有惊喜">
      <div class="avatar-wrap-inner">柯</div>
    </div>
    <h1 id="nameTitle" title="⚡ 点我试试…">柯锐韬</h1>
    <p class="subtitle"><span id="typewriter"></span><span class="cursor">&nbsp;</span></p>
    <div class="clock">🕐 今天是 <span id="dateStr"></span> · 现在是 <span class="time" id="timeStr"></span></div>
  </header>

  <section class="section">
    <div class="section-title"><span class="icon">🪪</span>个人信息</div>
    <div class="info-grid">
      <div class="info-item"><span class="label-icon">👦</span><span><span class="label">姓名</span><span class="value">柯锐韬</span></span></div>
      <div class="info-item"><span class="label-icon">🚹</span><span><span class="label">性别</span><span class="value">男</span></span></div>
      <div class="info-item" id="ageItem" title="⚡ 点我试试…"><span class="label-icon">🎂</span><span><span class="label">年龄</span><span class="value">19岁</span></span></div>
      <div class="info-item"><span class="label-icon">🏮</span><span><span class="label">民族</span><span class="value">汉族</span></span></div>
      <div class="info-item"><span class="label-icon">📍</span><span><span class="label">籍贯</span><span class="value">广东惠州</span></span></div>
      <div class="info-item"><span class="label-icon">🏠</span><span><span class="label">居住地</span><span class="value">广东珠海</span></span></div>
      <div class="info-item"><span class="label-icon">📧</span><span><span class="label">邮箱</span><a class="value highlight" href="mailto:a3024377439@163.com" style="text-decoration:none;">a3024377439@163.com</a></span></div>
      <div class="info-item"><span class="label-icon">📱</span><span><span class="label">电话</span><a class="value" href="tel:17727216778" style="text-decoration:none;color:inherit;">17727216778</a></span></div>
    </div>
  </section>

  <section class="section">
    <div class="section-title"><span class="icon">🎓</span>个人经历</div>
    <div class="timeline">
      <div class="timeline-item">
        <span class="period">2025 — 2027 在读</span>
        <div class="title">广东科学技术职业学院</div>
        <div class="desc">在校学习阶段，持续提升专业技能与实践能力。</div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-title"><span class="icon">🏀</span>兴趣爱好 <span style="font-size:0.8rem;color:var(--text-dim);">（点击标签有惊喜）</span></div>
    <div class="tags">
      <span class="tag">🏀 打篮球</span>
      <span class="tag">🏸 球类运动</span>
      <span class="tag">💪 保持活力</span>
    </div>
  </section>

  <footer>—— 感谢您的阅读，期待与您的相遇 ——</footer>

</div>

<!-- 点赞按钮 -->
<button class="like-btn" id="likeBtn"><span id="likeIcon">👍</span> 点赞 <span id="likeCount">0</span></button>
<div class="toast" id="toast"></div>

<script>
  /* ================= 打字机 ================= */
  const phrases = ["一名热爱技术的学习者 ✨", "广东科学技术职业学院在读 🎓", "永远保持热爱，奔赴山海 🚀"];
  const typeEl = document.getElementById("typewriter");
  let pi = 0, ci = 0, deleting = false;
  (function typeLoop() {
    const text = phrases[pi];
    typeEl.textContent = text.slice(0, ci);
    let delay = deleting ? 40 : 110;
    if (!deleting && ci === text.length) { delay = 1800; deleting = true; }
    else if (deleting && ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; delay = 400; }
    else ci += deleting ? -1 : 1;
    setTimeout(typeLoop, delay);
  })();

  /* ================= 滚动渐入 ================= */
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("visible"); });
  }, { threshold: 0.15 });
  document.querySelectorAll(".section").forEach(s => observer.observe(s));

  /* ================= 实时时钟 ================= */
  const dateEl = document.getElementById("dateStr");
  const timeEl = document.getElementById("timeStr");
  const weekMap = ["日", "一", "二", "三", "四", "五", "六"];
  function tick() {
    const n = new Date();
    dateEl.textContent = n.getFullYear() + "年" + (n.getMonth() + 1) + "月" + n.getDate() + "日 星期" + weekMap[n.getDay()];
    timeEl.textContent = n.toTimeString().slice(0, 8);
  }
  tick();
  setInterval(tick, 1000);

  /* ================= 背景粒子 ================= */
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  let particles = [];
  function resizeBg() { canvas.width = innerWidth; canvas.height = innerHeight; }
  resizeBg();
  addEventListener("resize", resizeBg);
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
      r: Math.random() * 1.8 + 0.6
    });
  }
  function drawBg() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0, 212, 255, 0.5)";
      ctx.fill();
    }
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.hypot(dx, dy);
        if (dist < 110) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = "rgba(0, 212, 255, " + (0.12 * (1 - dist / 110)) + ")";
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(drawBg);
  }
  drawBg();

  /* ================= 特效层：拖尾 + 烟花 + 彩带 ================= */
  const fx = document.getElementById("fx-canvas");
  const fctx = fx.getContext("2d");
  function resizeFx() { fx.width = innerWidth; fx.height = innerHeight; }
  resizeFx();
  addEventListener("resize", resizeFx);

  const fxParts = [];
  const COLORS = ["#00d4ff", "#a855f7", "#ff2d95", "#ffd700", "#00ff88", "#ff6b35"];

  function addTrail(x, y) {
    fxParts.push({
      type: "trail", x: x + (Math.random() - 0.5) * 8, y: y + (Math.random() - 0.5) * 8,
      vx: 0, vy: -0.4, life: 1, decay: 0.03,
      r: Math.random() * 4 + 2,
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    });
  }
  function addFirework(x, y) {
    const n = 36;
    for (let i = 0; i < n; i++) {
      const ang = (Math.PI * 2 * i) / n;
      const speed = Math.random() * 3 + 2;
      fxParts.push({
        type: "spark", x, y,
        vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
        life: 1, decay: 0.016,
        r: Math.random() * 2.5 + 1,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        gravity: 0.05
      });
    }
  }
  function addConfetti(x, y) {
    for (let i = 0; i < 50; i++) {
      fxParts.push({
        type: "confetti", x, y,
        vx: (Math.random() - 0.5) * 9, vy: Math.random() * -7 - 2,
        life: 1, decay: 0.012,
        w: Math.random() * 8 + 4, h: Math.random() * 5 + 3,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        gravity: 0.18
      });
    }
  }

  let lastTrail = 0;
  addEventListener("mousemove", e => {
    const now = Date.now();
    if (now - lastTrail > 24) { addTrail(e.clientX, e.clientY); lastTrail = now; }
  });
  addEventListener("click", e => {
    if (e.target.closest("button") || e.target.closest("a")) return;
    addFirework(e.clientX, e.clientY);
  });

  function drawFx() {
    fctx.clearRect(0, 0, fx.width, fx.height);
    for (let i = fxParts.length - 1; i >= 0; i--) {
      const p = fxParts[i];
      p.life -= p.decay;
      if (p.life <= 0) { fxParts.splice(i, 1); continue; }
      p.x += p.vx; p.y += p.vy;
      if (p.gravity) p.vy += p.gravity;
      if (p.type === "confetti") {
        p.rot += p.vr; p.vx *= 0.985;
        fctx.save();
        fctx.translate(p.x, p.y);
        fctx.rotate(p.rot);
        fctx.globalAlpha = p.life;
        fctx.fillStyle = p.color;
        fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        fctx.restore();
      } else {
        fctx.globalAlpha = p.life;
        fctx.beginPath();
        fctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        fctx.fillStyle = p.color;
        fctx.fill();
      }
      fctx.globalAlpha = 1;
    }
    requestAnimationFrame(drawFx);
  }
  drawFx();

  /* ================= 提示气泡 ================= */
  const toast = document.getElementById("toast");
  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
  }

  /* ================= 昼夜切换 ================= */
  const themeBtn = document.getElementById("theme-btn");
  themeBtn.addEventListener("click", () => {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");
    themeBtn.textContent = isLight ? "☀️" : "🌙";
    showToast(isLight ? "☀️ 白天模式已开启" : "🌙 夜晚模式已开启");
  });

  /* ================= 8-bit 小音乐（Web Audio 合成） ================= */
  let audioCtx = null, musicOn = false, musicTimer = null, noteIdx = 0;
  const melody = [
    659, 0, 659, 0, 659, 0, 523, 659, 0, 784, 0, 0, 0, 392,
    523, 0, 392, 0, 330, 0, 440, 494, 0, 466, 440, 0, 392, 0
  ];
  function playNote(freq, dur) {
    if (!freq) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }
  const musicBtn = document.getElementById("music-btn");
  musicBtn.addEventListener("click", () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicOn = !musicOn;
    musicBtn.textContent = musicOn ? "🔊" : "🎵";
    if (musicOn) {
      showToast("🎵 8-bit 小音乐开启！");
      musicTimer = setInterval(() => {
        playNote(melody[noteIdx % melody.length], 0.18);
        noteIdx++;
      }, 200);
    } else {
      clearInterval(musicTimer);
      showToast("🔇 音乐已关闭");
    }
  });

  /* ================= 点赞 + 彩带 ================= */
  const likeBtn = document.getElementById("likeBtn");
  const likeCount = document.getElementById("likeCount");
  let likes = parseInt(localStorage.getItem("resume_likes") || "0");
  likeCount.textContent = likes;
  likeBtn.addEventListener("click", e => {
    likes++;
    localStorage.setItem("resume_likes", likes);
    likeCount.textContent = likes;
    likeBtn.classList.remove("bumped");
    void likeBtn.offsetWidth; // 重启动画
    likeBtn.classList.add("bumped");
    const r = likeBtn.getBoundingClientRect();
    addConfetti(r.left + r.width / 2, r.top);
    const cheers = ["谢谢点赞！🎉", "你人还怪好的嘞 😆", "点赞 +1，好运 +1 ✨", "再点也不会坏哦 😝"];
    showToast(cheers[Math.floor(Math.random() * cheers.length)]);
  });

  /* ================= 头像彩蛋 ================= */
  const avatar = document.getElementById("avatar");
  avatar.addEventListener("click", () => {
    const r = avatar.getBoundingClientRect();
    for (let i = 0; i < 3; i++) {
      setTimeout(() => addFirework(
        r.left + r.width / 2 + (Math.random() - 0.5) * 120,
        r.top + r.height / 2 + (Math.random() - 0.5) * 120
      ), i * 250);
    }
    const lines = ["哇！烟花！🎆", "再点一次试试？😏", "别点了，头都晕了 🌀", "你是唯一一个发现的人吗？🤔"];
    showToast(lines[Math.floor(Math.random() * lines.length)]);
  });

  /* ================= 兴趣标签彩蛋 ================= */
  document.querySelectorAll(".tag").forEach(tag => {
    tag.addEventListener("click", e => {
      addFirework(e.clientX, e.clientY);
      showToast(tag.textContent.trim() + " —— 同好您好！👋");
    });
  });

  /* ================= 姓名传送门彩蛋 ================= */
  const nameTitle = document.getElementById("nameTitle");
  nameTitle.style.cursor = "pointer";
  nameTitle.addEventListener("click", e => {
    addFirework(e.clientX, e.clientY);
    addFirework(e.clientX - 40, e.clientY - 20);
    showToast("🧱 正在跃迁至俄罗斯方块世界…");
    setTimeout(() => { location.href = "tetris.html"; }, 900);
  });

  /* ================= 年龄传送门彩蛋 ================= */
  const ageItem = document.getElementById("ageItem");
  ageItem.style.cursor = "pointer";
  ageItem.addEventListener("click", e => {
    addFirework(e.clientX, e.clientY);
    addFirework(e.clientX + 40, e.clientY - 30);
    showToast("⚡ 检测到隐藏飞行通道，正在跃迁至雷霆战机…");
    setTimeout(() => { location.href = "game.html"; }, 900);
  });

  /* ================= 标题栏彩蛋 ================= */
  const realTitle = document.title;
  document.addEventListener("visibilitychange", () => {
    document.title = document.hidden ? "👀 别走呀！快回来——" : realTitle;
  });

  /* ================= Konami 秘籍彩蛋 ================= */
  const konami = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
  let kIdx = 0;
  addEventListener("keydown", e => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (key === konami[kIdx]) {
      kIdx++;
      if (kIdx === konami.length) {
        kIdx = 0;
        document.body.classList.toggle("rainbow");
        const on = document.body.classList.contains("rainbow");
        for (let i = 0; i < 6; i++) {
          setTimeout(() => addFirework(Math.random() * innerWidth, Math.random() * innerHeight * 0.6), i * 200);
        }
        showToast(on ? "🌈 上上下下左右左右BA —— 彩虹模式开启！" : "🌈 彩虹模式关闭");
      }
    } else {
      kIdx = key === konami[0] ? 1 : 0;
    }
  });
</script>
